[project]
name = "opensubtitles-uploader"
version = "0.1.0"
description = "Multiplataforma (Windows/macOS/Linux) para analizar un video local y subir sus subtítulos a OpenSubtitles — reimplementación en Python del clásico OpenSubtitles Uploader, con arquitectura hexagonal."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anibal Gonzalez Herrera", email = "anibalgh@msn.com" }
]
requires-python = ">=3.12,<3.14"
keywords = ["opensubtitles", "subtitles", "uploader", "video", "pyside6", "hexagonal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "cryptography>=42.0.0,<46.0.0",
    "platformdirs>=4.2.0,<5.0.0",
    "PySide6>=6.7.0,<6.10.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.optional-dependencies]
# Use the operating-system keychain (instead of the encrypted local file).
keyring = ["keyring>=24.0.0,<26.0.0"]

[project.scripts]
opensubtitles-uploader = "opensubtitles_uploader.adapters.cli.main:app"
opensubtitles-uploader-gui = "opensubtitles_uploader.adapters.ui.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "opensubtitles_uploader", from = "src" }]
include = ["src/opensubtitles_uploader/data/**/*"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0,<9.0.0"
pytest-cov = ">=5.0.0,<7.0.0"
ruff = ">=0.5.0,<1.0.0"
mypy = ">=1.10.0,<2.0.0"
bandit = ">=1.7.9,<2.0.0"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not e2e'"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that touch the network (skipped by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "RUF"]
ignore = [
    "B008",  # function calls in default arguments (e.g. FastAPI Depends)
]
# Tests may use assert-style helpers and loose exception checks.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B024", "S101", "FBT", "E501"]
# Data-heavy modules: word lists and UI strings are intentionally long,
# and non-Latin stop words legitimately contain confusable characters.
"src/opensubtitles_uploader/adapters/media/language_detector.py" = ["E501", "RUF001"]
"src/opensubtitles_uploader/adapters/ui/i18n.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
check_untyped_defs = true
exclude = ["tests/e2e/"]
# The GUI layer is intentionally pragmatic about Qt dynamic typing.
[[tool.mypy.overrides]]
module = ["opensubtitles_uploader.adapters.ui.*"]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist"]
skips = ["B101", "B105"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
